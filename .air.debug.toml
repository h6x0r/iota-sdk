root = "."

testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
# Produce a non-optimized binary suitable for debugging (-N -l flags)
cmd = "go build -gcflags 'all=-N -l' -o ./tmp/main cmd/server/main.go"
bin = "./tmp/main"
# Delay between change detection and rebuild (ms)
delay = 1000
include_ext = ["go", "html", "json", "js", "css", "toml", "yml", "yaml"]
exclude_dir = [
  "tmp",
  "vendor",
  "testdata",
  "postgres-data",
  "static",
  "py-embed",
  "e2e",
]
exclude_file = [
  ".air.toml",
  ".air.debug.toml",
  ".air.testing.toml",
  "compose.yml",
  "compose.dev.yml",
  "compose.testing.yml",
]
exclude_regex = ["_test.go"]
log = "build-errors.log"

[run]
# Launch Delve in headless mode so an IDE can attach on port 2345
cmd = "dlv exec --continue --headless --listen=:2345 --api-version=2 ./tmp/main"

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[proxy]
enabled = true
proxy_port = 8090
app_port = 3200

[log]
main_only = false
time = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true